# Included in the HTTPS vhost of eszleles.hu: the log viewer without a subdomain.
Alias /naplok/stats /var/lib/eszleles-logs/report.html
Alias /naplok /var/www/logs.eszleles.hu

<Location /naplok>
    AuthType Basic
    AuthName "logs"
    AuthUserFile /etc/apache2/logs.htpasswd
    Require valid-user
</Location>

# The polling of the viewer would fill the log it shows.
SetEnvIf Request_URI "^/naplok(/|$)" nolog
ErrorLog /var/log/eszleles/error.log
CustomLog /var/log/eszleles/access.log combined env=!nolog
