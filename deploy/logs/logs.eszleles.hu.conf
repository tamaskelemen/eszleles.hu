<VirtualHost *:80>
    ServerName logs.eszleles.hu
    DocumentRoot /var/www/logs.eszleles.hu
    Alias /stats /var/lib/eszleles-logs/report.html

    <Location />
        AuthType Basic
        AuthName "logs"
        AuthUserFile /etc/apache2/logs.htpasswd
        Require valid-user
    </Location>

    # Not in /var/log/eszleles: the polling of the viewer would fill the log it shows.
    ErrorLog ${APACHE_LOG_DIR}/logs-error.log
    CustomLog ${APACHE_LOG_DIR}/logs-access.log combined
</VirtualHost>
